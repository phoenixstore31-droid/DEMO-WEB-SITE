<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BIG STORE</title>

    <meta name="theme-color" content="#080808">

    <link rel="stylesheet" href="css/auth.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="auth-container">

        <!-- LOGIN BOX -->
        <div class="auth-box">

            <!-- LOGO -->
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-crown"></i>
                </div>

                <h1>BIG <span>STORE</span></h1>
                <p>PREMIUM GAMING EXPERIENCE</p>
            </div>

            <!-- HEADING -->
            <div class="auth-heading">
                <h2>Welcome Back!</h2>
                <p>Login to continue your gaming journey.</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="input-group">
                    <label>Email Address</label>

                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button type="button"
                                class="password-toggle"
                                id="togglePassword">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- FORGOT PASSWORD -->
                <div class="forgot-row">
                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>
                </div>

                <!-- MESSAGE -->
                <div id="loginMessage" class="auth-message"></div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="auth-submit" id="loginButton">
                    <span>LOGIN</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <!-- REGISTER LINK -->
            <div class="auth-switch">
                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>
            </div>

            <!-- SECURITY -->
            <div class="auth-security">
                <i class="fa-solid fa-shield-halved"></i>
                Secure Account Protection
            </div>

        </div>

        <!-- FOOTER -->
        <div class="auth-footer">
            © <span id="currentYear"></span> BIG STORE. All Rights Reserved.
        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
