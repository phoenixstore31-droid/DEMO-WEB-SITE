<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | BIG STORE</title>

    <meta name="theme-color" content="#080808">

    <link rel="stylesheet" href="css/auth.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <!-- LOGO -->
            <div class="auth-logo">

                <div class="logo-icon">
                    <i class="fa-solid fa-crown"></i>
                </div>

                <h1>BIG <span>STORE</span></h1>

                <p>PREMIUM GAMING EXPERIENCE</p>

            </div>

            <!-- ICON -->
            <div class="forgot-icon">
                <i class="fa-solid fa-key"></i>
            </div>

            <!-- HEADING -->
            <div class="auth-heading">

                <h2>Forgot Password?</h2>

                <p>
                    Don't worry! Enter your registered email address.
                    We'll send you a password reset link.
                </p>

            </div>

            <!-- FORM -->
            <form id="forgotPasswordForm">

                <div class="input-group">

                    <label>Email Address</label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="forgotEmail"
                            placeholder="Enter your registered email"
                            required
                            autocomplete="email"
                        >

                    </div>

                </div>

                <!-- MESSAGE -->
                <div id="forgotMessage" class="auth-message"></div>

                <!-- BUTTON -->
                <button type="submit"
                    class="auth-submit"
                    id="forgotButton">

                    <span>SEND RESET LINK</span>

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </form>

            <!-- LOGIN LINK -->
            <div class="auth-switch">

                Remember your password?

                <a href="login.html">Login Now</a>

            </div>

            <!-- SECURITY -->
            <div class="auth-security">

                <i class="fa-solid fa-shield-halved"></i>

                Secure Password Recovery

            </div>

        </div>

        <!-- FOOTER -->
        <div class="auth-footer">

            © <span id="currentYear"></span> BIG STORE. All Rights Reserved.

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
